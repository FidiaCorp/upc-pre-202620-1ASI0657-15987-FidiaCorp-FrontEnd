# Example static SPA server. Install as the server config and copy dist/ into root.
# TLS may terminate at a trusted reverse proxy in front of this local HTTP server.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API must never fall back to HTML.
    # For a same-origin API, replace `return 404` with the proxy directives from README.
    # For an HTTPS API at another origin, keep this block and configure backend CORS.
    location ^~ /api/ {
        return 404;
    }
    location = /api {
        return 404;
    }

    # Vite emits content-hashed assets. Missing assets are actual 404s, not index.html.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(?:js|css|map|png|jpg|jpeg|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Revalidate the HTML on every navigation; never keep an obsolete app shell.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
