# SPA CrediCasa servida por Nginx en :80 con proxy del mismo origen para la API.
# Etapa 2: toda la API pasa por el API Gateway (servicio Docker "api-gateway:8080"), que enruta a los 5 microservicios.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: resolución diferida para que Nginx arranque aunque la API aún no esté lista.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://api-gateway:8080;

    # La API nunca cae al index.html: se reenvía tal cual (incluido /api/v1/...).
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $request_id;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }
    location = /api {
        return 404;
    }

    # Vite emite assets con hash: un asset faltante es un 404 real, no index.html.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(?:js|css|map|png|jpg|jpeg|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # El shell HTML se revalida siempre.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # SPA fallback (rutas del router con historial HTML5).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
